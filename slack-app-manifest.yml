# Import this at https://api.slack.com/apps → "Create New App" → "From a manifest".
# It enables Socket Mode (no public URL needed) and the scopes CollaborAI uses.
# After creating the app:
#   1. Install it to your workspace → copy the Bot User OAuth Token (xoxb-…).
#   2. Basic Information → App-Level Tokens → generate a token with
#      `connections:write` scope (xapp-…).
#   3. Provide both to the server (env or the `server --slack` wizard).
display_information:
  name: CollaborAI
  description: Délègue des tâches de code à des instances Claude Code sur les machines de l'équipe.
features:
  bot_user:
    display_name: collaborai
    always_online: true
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - groups:history
      - pins:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - app_home_opened
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
